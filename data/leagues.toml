# Ligues importées dans la base, par niveau (tier).
# `name` = nom exact de la ligue dans Leaguepedia (table Leagues).
# L'import choisit lui-même le tournoi de référence : le premier tournoi régulier
# qui commence après le 15 décembre 2025, sinon le dernier de 2025.
# Liste établie à la main (Leaguepedia ne classe pas les ligues en tiers) :
# voir docs/decisions/005-ligues-et-tiers.md. Modifiable librement.
# `oe` = code de la ligue dans Oracle's Elixir quand il diffère de `id`.
# `academy_of` = ligue principale dont c'est l'académie (sert au niveau estimé de la ligue).
# Absentes car disparues en 2026 : LVP SuperLiga (remplacée par la LES),
# LFL Division 2 (fondue dans la LFL), Liga Valkyria (format de qualifications).

[[league]]
id = "LEC"
name = "LoL EMEA Championship"
tier = 1

[[league]]
id = "LCK"
name = "LoL Champions Korea"
tier = 1

[[league]]
id = "LPL"
name = "Tencent LoL Pro League"
tier = 1

[[league]]
id = "LCS"
name = "League of Legends Championship Series"
tier = 1
oe = ["LTA N"]

[[league]]
id = "CBLOL"
name = "Circuit Brazilian League of Legends"
tier = 1
oe = ["LTA S"]

[[league]]
id = "LCP"
name = "League of Legends Championship Pacific"
tier = 1

